name: Telegram 알림

on:
  push:
    paths:
      - "reports/**_screening.md"
      - "reports/**_morning.md"
      - "reports/**_closing.md"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 시크릿 확인
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "BOT 길이: ${#BOT_TOKEN}"
          echo "CHAT: $CHAT_ID"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}&text=GitHub Actions 테스트 메시지" | cat

      - name: 리포트 전송
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          pip install requests -q
          python3 send_notify.py
