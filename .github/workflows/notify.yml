name: Telegram 알림

on:
  push:
    paths:
      - "reports/**_screening.md"
      - "reports/**_morning.md"
      - "reports/**_closing.md"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: pip install
        run: pip install requests -q

      - name: 변경된 리포트 전송
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 send_notify.py
